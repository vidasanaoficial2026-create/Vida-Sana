{% extends "base.html" %}

{% block title %}Editor de Landing Page{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-edit text-primary"></i> Editor de Landing Page</h2>
    <a href="/landing" class="btn btn-outline-secondary" target="_blank"><i class="fas fa-external-link-alt"></i> Ver Landing Page</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form id="formLanding">
        <h5 class="text-success border-bottom pb-2 mb-3">Sección Principal (Hero)</h5>
        
        <div class="mb-3">
          <label class="form-label fw-bold">Título Principal</label>
          <input type="text" class="form-control" id="hero_title" value="{{ config.get('hero_title', '') }}" placeholder="Ej: Bienestar Natural">
          <div class="form-text">Puedes usar &lt;br&gt; para saltos de línea y &lt;span&gt; para texto resaltado.</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Subtítulo</label>
          <textarea class="form-control" id="hero_subtitle" rows="3">{{ config.get('hero_subtitle', '') }}</textarea>
        </div>

        <h5 class="text-success border-bottom pb-2 mb-3">Sección "Quiénes Somos"</h5>
        
        <div class="mb-3">
          <label class="form-label fw-bold">Título de Sección</label>
          <input type="text" class="form-control" id="about_title" value="{{ config.get('about_title', '') }}">
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Texto Descriptivo</label>
          <textarea class="form-control" id="about_text" rows="4">{{ config.get('about_text', '') }}</textarea>
        </div>

        <div class="text-end mt-4">
          <button type="button" class="btn btn-primary px-4" onclick="saveLandingConfig()">
            <i class="fas fa-save"></i> Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
async function saveLandingConfig() {
  const data = {
    hero_title: document.getElementById('hero_title').value,
    hero_subtitle: document.getElementById('hero_subtitle').value,
    about_title: document.getElementById('about_title').value,
    about_text: document.getElementById('about_text').value
  };

  try {
    const res = await fetch('/api/landing_config', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if(result.ok) {
      alert('Configuración guardada correctamente.');
    } else {
      alert('Error: ' + result.error);
    }
  } catch(e) {
    console.error('Error guardando', e);
    alert('Error de red al guardar.');
  }
}
</script>
{% endblock %}
